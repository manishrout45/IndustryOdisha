version: "3.9"

services:
  frontend:
    build:
      context: ../../frontend/public-website
      dockerfile: ../../infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ../../backend
      dockerfile: ../../infrastructure/docker/Dockerfile.backend
    ports:
      - "5000:5000"
    env_file:
      - ../../backend/.env